// Service interfaces swept in by the coreSources globs but deferred to the android/adapter layer
// because they return LiveData/PagedList.
ext.coreExcludes = [
        // The paged devtools views of the crypto store; the store itself is shared.
        'org/matrix/android/sdk/internal/crypto/store/db/sql/AndroidCryptoStore.kt',
]

sourceSets {
    main {
        kotlin {
            srcDir '../matrix-sdk-android/src/main/java'
            srcDir '../matrix-sdk-android/src/release/java'
            setIncludes(coreSources)
            setExcludes(coreExcludes)
        }
    }
}

// These classes must exist for core's own compile but are compiled again by the android module
// (BuildConfig is AGP-generated; CurlLoggingInterceptor is per-variant under src/debug|release) —
// shipping core's copy too fails the app's dex merge with duplicate classes. A desktop runtime
// consumer must supply them itself.
jar {
    exclude 'org/matrix/android/sdk/BuildConfig*'
    exclude 'org/matrix/android/sdk/internal/network/interceptors/CurlLoggingInterceptor*'
}

dependencies {
    implementation project(':library:external:timber-jvm')
    implementation project(':library:external:olm-jvm')
    implementation libs.jetbrains.coroutinesCore
    // Pure-JVM annotations jar (no android platform code); lets annotation-only files compile in core.
    implementation 'androidx.annotation:annotation-jvm:1.6.0'
    implementation "app.cash.sqldelight:runtime:2.0.2"
    implementation "app.cash.sqldelight:coroutines-extensions:2.0.2"
    implementation libs.squareup.moshi
    implementation libs.squareup.moshiAdapters
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.13'
    implementation 'com.squareup.okio:okio:3.6.0'
    implementation 'javax.inject:javax.inject:1'
    implementation libs.dagger.dagger
    implementation libs.squareup.retrofit
    implementation libs.squareup.retrofitMoshi
    // compileOnly: android provides org.json natively, and its JSONArray keeps its values in a
    // differently named field. Shipping this one too lets R8 bind canonical-JSON field access to the
    // library class while the platform class wins at runtime — NoSuchFieldError inside signature
    // verification, release builds only. A JVM consumer supplies it at runtime itself.
    compileOnly 'org.json:json:20240303'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation libs.google.phonenumber
    api "com.atlassian.commonmark:commonmark:0.13.0"
    api "com.atlassian.commonmark:commonmark-ext-gfm-tables:0.13.0"
    kapt libs.squareup.moshiKotlin
    // Generate the Dagger @Provides/@Inject factories for the @Modules that live in core; the
    // components that consume them are generated in :matrix-sdk-android.
    kapt libs.dagger.daggerCompiler

    testImplementation 'junit:junit:4.13.2'
    // The JVM has no org.json of its own, so core's own tests need a real one.
    testImplementation 'org.json:json:20240303'
}

apply from: "$rootDir/gradle/jvm-publish.gradle"
