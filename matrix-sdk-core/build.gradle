// Desktop-port core gate: compiles a growing include-list of matrix-sdk-android's own sources as
// plain JVM (no Android on the classpath), without moving files — the android module keeps
// compiling them unchanged. Growing `coreSources` is the extraction ratchet: once a file is listed
// it can never regress into android imports without breaking this module's build.
//
// Standalone module: nothing in the Android app depends on it. Build with :matrix-sdk-core:build.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'kotlin-kapt'
apply plugin: 'app.cash.sqldelight'

buildscript {
    repositories {
        maven { url 'https://repo1.maven.org/maven2' }
    }
    dependencies {
        classpath "app.cash.sqldelight:gradle-plugin:2.0.2"
    }
}

// Generate the SQLDelight databases from the android module's .sq files — same schemas, same
// generated API, verified here to compile as plain JVM. The desktop driver is JDBC (proven by
// matrix-sdk-android's JdbcSqlDriverTest); the android module keeps its FrameworkSqliteDriver.
sqldelight {
    databases {
        GlobalSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.database.global"
            srcDirs.setFrom("../matrix-sdk-android/src/main/sqldelight/global")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        AuthSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.auth.db"
            srcDirs.setFrom("../matrix-sdk-android/src/main/sqldelight/auth")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        IdentitySqlDatabase {
            packageName = "org.matrix.android.sdk.internal.session.identity.db"
            srcDirs.setFrom("../matrix-sdk-android/src/main/sqldelight/identity")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        ContentScannerSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.session.contentscanner.db"
            srcDirs.setFrom("../matrix-sdk-android/src/main/sqldelight/contentscanner")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        CryptoSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.crypto.store.db.sql"
            srcDirs.setFrom("../matrix-sdk-android/src/main/sqldelight/crypto")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        SessionSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.database.sql"
            srcDirs.setFrom("../matrix-sdk-android/src/main/sqldelight/session")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        EventIndexSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.session.search.index.db"
            srcDirs.setFrom("../matrix-sdk-android/src/main/sqldelight/eventindex")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        RedactedContentSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.session.room.redaction.db"
            srcDirs.setFrom("../matrix-sdk-android/src/main/sqldelight/redactedcontent")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain(21)
}

