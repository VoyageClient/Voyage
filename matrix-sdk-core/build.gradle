// Desktop-port core gate: compiles a growing include-list of matrix-sdk-android's own sources as
// plain JVM (no Android on the classpath), without moving files — the android module keeps
// compiling them unchanged. Growing `coreSources` is the extraction ratchet: once a file is listed
// it can never regress into android imports without breaking this module's build.
//
// Standalone module: nothing in the Android app depends on it. Build with :matrix-sdk-core:build.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'kotlin-kapt'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain(21)
}

def coreSources = [
