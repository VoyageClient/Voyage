apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-parcelize'
apply plugin: 'app.cash.sqldelight'
apply plugin: "org.jetbrains.dokka"

if (project.hasProperty("coverage")) {
    apply plugin: 'jacoco'
}

buildscript {
    repositories {
        // Do not use `mavenCentral()`, it prevents Dependabot from working properly
        maven {
            url 'https://repo1.maven.org/maven2'
        }
    }
    dependencies {
        classpath "app.cash.sqldelight:gradle-plugin:2.0.2"
    }
}

dokkaHtml {
    dokkaSourceSets {
        configureEach {
            // Emit warnings about not documented members.
            // reportUndocumented.set(true)
            // Suppress legacy Riot's packages.
            perPackageOption {
                matchingRegex.set("org.matrix.android.sdk.internal.legacy.riot")
                suppress.set(true)
            }
            perPackageOption {
                matchingRegex.set("org.matrix.androidsdk.crypto.data")
                suppress.set(true)
            }
            // List of files with module and package documentation
            // https://kotlinlang.org/docs/reference/kotlin-doc.html#module-and-package-documentation
            includes.from("./docs/modules.md", "./docs/packages.md")
        }
    }
}

android {
    namespace "org.matrix.android.sdk"

    testOptions.unitTests.includeAndroidResources = true

    compileSdk versions.compileSdk

    defaultConfig {
        minSdk versions.minSdk
        targetSdk versions.targetSdk

        // Multidex is useful for tests
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The following argument makes the Android Test Orchestrator run its
        // "pm clear" command after each test invocation. This command ensures
        // that the app's state is completely cleared between tests.
        testInstrumentationRunnerArguments clearPackageData: 'true'

        buildConfigField "String", "SDK_VERSION", "\"1.6.62\""

        buildConfigField "String", "GIT_SDK_REVISION", "\"${gitRevision()}\""
        buildConfigField "String", "GIT_SDK_REVISION_UNIX_DATE", "\"${gitRevisionUnixDate()}\""
        buildConfigField "String", "GIT_SDK_REVISION_DATE", "\"${gitRevisionDate()}\""

        defaultConfig {
            consumerProguardFiles 'proguard-rules.pro'
        }
    }

    testOptions {
        // Comment to run on Android 12
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    buildTypes {
        debug {
            if (project.hasProperty("coverage")) {
                testCoverageEnabled = project.properties["coverage"] == "true"
            }
            // Set to true to log privacy or sensible data, such as token
            buildConfigField "boolean", "LOG_PRIVATE_DATA", project.property("vector.debugPrivateData")
            // Set to BODY instead of NONE to enable logging
            buildConfigField "okhttp3.logging.HttpLoggingInterceptor.Level", "OKHTTP_LOGGING_LEVEL", "okhttp3.logging.HttpLoggingInterceptor.Level." + project.property("vector.httpLogLevel")
        }

        release {
            buildConfigField "boolean", "LOG_PRIVATE_DATA", "false"
            buildConfigField "okhttp3.logging.HttpLoggingInterceptor.Level", "OKHTTP_LOGGING_LEVEL", "okhttp3.logging.HttpLoggingInterceptor.Level.BASIC"
        }
    }

    adbOptions {
        installOptions "-g"
//        timeOutInMs 350 * 1000
    }

    compileOptions {
        sourceCompatibility versions.sourceCompat
        targetCompatibility versions.targetCompat
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = versions.jvmTarget
        freeCompilerArgs += [
                // Disabled for now, there are too many errors. Could be handled in another dedicated PR
                // '-Xexplicit-api=strict', // or warning
                "-opt-in=kotlin.RequiresOptIn",
                // Opt in for kotlinx.coroutines.FlowPreview
                "-opt-in=kotlinx.coroutines.FlowPreview",
        ]
    }

    sourceSets {
        androidTest {
            java.srcDirs += "src/sharedTest/java"
        }
        test {
            java.srcDirs += "src/sharedTest/java"
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        pickFirsts.add("META-INF/LICENSE.md")
        pickFirsts.add("META-INF/LICENSE-notice.md")
        pickFirsts.add("MANIFEST.MF")
    }
}

static def gitRevision() {
    def cmd = "git rev-parse --short=8 HEAD"
    return cmd.execute().text.trim()
}

static def gitRevisionUnixDate() {
    def cmd = "git show -s --format=%ct HEAD^{commit}"
    return cmd.execute().text.trim()
}

static def gitRevisionDate() {
    def cmd = "git show -s --format=%ci HEAD^{commit}"
    return cmd.execute().text.trim()
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

// SQLDelight databases. These generated classes are consumed only by this module's own store
// impls (which stay here, excluded from :matrix-sdk-core); core's included files reference the
// plain entity/mapper types, not the generated queries, so core filters them out of its jar and
// there is no cross-module duplication.
sqldelight {
    databases {
        GlobalSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.database.global"
            srcDirs.setFrom("src/main/sqldelight/global")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        AuthSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.auth.db"
            srcDirs.setFrom("src/main/sqldelight/auth")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        IdentitySqlDatabase {
            packageName = "org.matrix.android.sdk.internal.session.identity.db"
            srcDirs.setFrom("src/main/sqldelight/identity")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        ContentScannerSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.session.contentscanner.db"
            srcDirs.setFrom("src/main/sqldelight/contentscanner")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        CryptoSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.crypto.store.db.sql"
            srcDirs.setFrom("src/main/sqldelight/crypto")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        SessionSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.database.sql"
            srcDirs.setFrom("src/main/sqldelight/session")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
        EventIndexSqlDatabase {
            packageName = "org.matrix.android.sdk.internal.session.search.index.db"
            srcDirs.setFrom("src/main/sqldelight/eventindex")
            dialect("app.cash.sqldelight:sqlite-3-18-dialect:2.0.2")
        }
    }
}

dependencies {
    // Phase 5: the plain-JVM core module compiles the android-free subset of this module's own
    // sources; those files are excluded from this module's compile below and consumed from core.
    api project(':matrix-sdk-core')
    implementation libs.jetbrains.coroutinesCore
    implementation libs.jetbrains.coroutinesAndroid

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

 //   implementation libs.androidx.appCompat
    implementation libs.androidx.core

    implementation libs.androidx.lifecycleLivedata

    // Lifecycle
    implementation libs.androidx.lifecycleCommon
    implementation libs.androidx.lifecycleProcess

    // Network
    implementation libs.squareup.retrofit
    implementation libs.squareup.retrofitMoshi

    // 3.12.x is the last OkHttp line supporting Android 4.x (KitKat); 3.13+ require API 21.
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.13'

    implementation libs.squareup.moshi
    implementation libs.squareup.moshiAdapters
    kapt libs.squareup.moshiKotlin

    api "com.atlassian.commonmark:commonmark:0.13.0"
    api "com.atlassian.commonmark:commonmark-ext-gfm-tables:0.13.0"

    // Image
    implementation libs.androidx.exifinterface
    implementation libs.vanniktech.blurhash

    // Database

    // Paging 2 — public API exposes PagedList; was previously pulled in transitively via realm-monarchy.
    implementation libs.androidx.pagingRuntimeKtx

    // SQLDelight (replacing Realm). runtime = generated-code support; coroutines-extensions = asFlow/mapToList.
    implementation "app.cash.sqldelight:runtime:2.0.2"
    implementation "app.cash.sqldelight:coroutines-extensions:2.0.2"

    // Shared Preferences
    implementation libs.androidx.preferenceKtx

    // Work
    implementation libs.androidx.work

    // DI
    implementation libs.dagger.dagger
    kapt libs.dagger.daggerCompiler

    // Logging
    implementation libs.jakewharton.timber

    // Video compression uses the platform MediaCodec/MediaMuxer stack directly (works on KitKat,
    // no native deps) — see VideoCompressor.
    // Frame-level GIF decoding for the animated GIF -> animated WebP recompress path.
    implementation 'com.github.bumptech.glide:gifdecoder:4.16.0'

    // Exif data handling
    implementation libs.apache.commonsImaging

    implementation libs.google.phonenumber

    implementation project(':library:external:libce')
    implementation project(':library:external:libopus')

    testImplementation libs.tests.junit
    // Plain-JVM (JDBC) SQLDelight driver: proves the schemas run off-Android (desktop target)
    testImplementation "app.cash.sqldelight:sqlite-driver:2.0.2"
    testImplementation "androidx.work:work-testing:2.8.1"
    // Note: version sticks to 1.9.2 due to https://github.com/mockk/mockk/issues/281
    testImplementation libs.mockk.mockk
    testImplementation libs.tests.kluent
    testImplementation libs.jetbrains.coroutinesTest
    // Plant Timber tree for test
    testImplementation 'net.lachlanmckee:timber-junit-rule:1.0.1'
    // Transitively required for mocking realm as monarchy doesn't expose Rx
    testImplementation libs.rx.rxKotlin
    testImplementation libs.tests.robolectric

    kaptAndroidTest libs.dagger.daggerCompiler
    androidTestImplementation libs.androidx.testCore
    androidTestImplementation libs.androidx.testRunner
    androidTestImplementation libs.androidx.testRules
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espressoCore
    androidTestImplementation libs.tests.kluent
    androidTestImplementation libs.mockk.mockkAndroid
    androidTestImplementation libs.androidx.coreTesting
    androidTestImplementation libs.jetbrains.coroutinesAndroid
    androidTestImplementation libs.jetbrains.coroutinesTest

    // Plant Timber tree for test
    androidTestImplementation libs.tests.timberJunitRule

    androidTestUtil libs.androidx.orchestrator
}

// Phase 5 module inversion: :matrix-sdk-core compiles the android-free subset of THIS module's
// sources into a plain-JVM jar. Exclude exactly those files from this module's own compilation to
// avoid duplicate classes, and use Kotlin friend-paths so this module still sees core's `internal`
// declarations (the friend path must be core's jar, the actual compile-classpath entry).
evaluationDependsOn(':matrix-sdk-core')
def coreProject = project(':matrix-sdk-core')
def coreSrcRoot = file('src/main/java')
def resolveCorePatterns = { patterns ->
    def result = [] as Set
    patterns.each { pat ->
        if (pat.endsWith('/**')) {
            fileTree(dir: coreSrcRoot, includes: [pat.substring(0, pat.length() - 3) + '/**/*.kt']).files.each {
                result << coreSrcRoot.toPath().relativize(it.toPath()).toString()
            }
        } else if (pat.endsWith('.kt') && new File(coreSrcRoot, pat).exists()) {
            result << pat
        }
    }
    result
}
def coreCompiledFiles = resolveCorePatterns(coreProject.coreSources) - resolveCorePatterns(coreProject.coreExcludes)
// BuildConfig.kt is generated for this module and only a no-op entry in coreSources; keep it here.
coreCompiledFiles.remove('org/matrix/android/sdk/BuildConfig.kt')

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
    task.exclude { coreCompiledFiles.contains(it.relativePath.pathString) }
    // Friend path must be the exact classpath entry, which AGP jetifies/transforms to a cache path;
    // derive it from the resolved compile classpath rather than the original jar location.
    task.friendPaths.from(providers.provider {
        task.libraries.files.findAll { it.name.contains('matrix-sdk-core') }
    })
}
