name: Nightly APKs

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even when no code changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # Only libopus/libce compile native code; the 21.3.6528147 elsewhere is inert.
  NDK_VERSION: 'ndk;23.2.8568313'
  CMAKE_VERSION: 'cmake;3.22.1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # The nightly tag sits on the last commit that was built, so it marks what has already shipped.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether anything worth building changed
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = 'true' ]; then
            echo 'Forced from workflow_dispatch.'
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          if [ -z "$last" ]; then
            echo 'No nightly tag yet, so nothing has been built.'
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Exclude-only pathspecs match everything else, so whatever is not listed counts as code.
          # glob magic stops * crossing /, keeping these at the root — without it *.md would also
          # swallow a module's own files, e.g. an asset under src/main/assets.
          changed=$(git diff --name-only "$last" HEAD -- \
            ':(exclude,glob)*.md' \
            ':(exclude)docs' \
            ':(exclude,glob)*/docs/**' \
            ':(exclude)resources' \
            ':(exclude)fastlane' \
            ':(exclude)changelog.d' \
            ':(exclude,glob)LICENSE*' \
            ':(exclude).idea' \
            ':(exclude).claude')
          if [ -z "$changed" ]; then
            echo "No code changes since $last; skipping the build."
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo "Code changed since $last:"
            echo "$changed"
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  nightly:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout the commit to build
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: false
          # Tagless on purpose: a tag on HEAD switches getVersionCode() off the timestamp scheme,
          # breaking upgrades over older nightlies.
          fetch-depth: 20

      - name: Free up disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android/sdk/ndk &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo docker image prune --all --force > /dev/null &
          wait
          # R8 peaks past the runner's 16 GB; without swap the kernel kills the runner agent itself.
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK and CMake
        run: |
          set -euo pipefail
          printf 'y\n%.0s' {1..50} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$NDK_VERSION" "$CMAKE_VERSION"

      - name: Assemble APKs
        run: |
          ./gradlew :vector-app:assembleRelease --stacktrace -x lintVitalRelease \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            -Dkotlin.daemon.jvmargs=-Xmx2g \
            --max-workers=2

      - name: Report memory and disk headroom
        if: always()
        run: |
          free -h
          df -h /

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find vector-app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts
          # The upload below needs room the build no longer does; / runs out otherwise.
          find . -type d -name build -prune -exec rm -rf {} +
          df -h /

      - name: Update the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Nightly build of Voyage at [$(git rev-parse --short HEAD)](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA})."
            echo
            echo "Recent commits:"
            git log -10 --pretty="- [%h](${{ github.server_url }}/${{ github.repository }}/commit/%H) %s"
          } > release-notes.md

          # The release keeps one tag forever; move it to the commit being built.
          git tag -f nightly "${{ github.sha }}"
          git push -f origin refs/tags/nightly

          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --title 'Nightly' --notes-file release-notes.md --prerelease
            gh release view nightly --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset nightly "$asset" --yes
            done
          else
            gh release create nightly --title 'Nightly' --notes-file release-notes.md --prerelease --draft=false
          fi

          gh release upload nightly artifacts/*.apk

          # Moving the tag reads server-side as a delete, which silently reverts the release to a
          # draft; publishing has to come last, and can lose a race with the tag update.
          for _ in 1 2 3 4 5; do
            gh release edit nightly --draft=false
            if [ "$(gh release view nightly --json isDraft --jq .isDraft)" = 'false' ]; then
              break
            fi
            sleep 10
          done
          gh release view nightly --json isDraft,tagName,assets --jq '{isDraft, tagName, assets: [.assets[].name]}'
          [ "$(gh release view nightly --json isDraft --jq .isDraft)" = 'false' ]
