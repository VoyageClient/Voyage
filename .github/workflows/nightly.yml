name: Nightly APKs

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # Only libopus/libce compile native code, and both pin this version. The 21.3.6528147 in
  # vector/ and vector-app/ is inert (no externalNativeBuild there) — local builds never install it.
  NDK_VERSION: 'ndk;23.2.8568313'
  CMAKE_VERSION: 'cmake;3.22.1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Shallow and tagless on purpose: the rolling `nightly` tag lands on HEAD every run, and a
          # tag on HEAD would switch getVersionCode() from the monotonic timestamp scheme to the
          # version-name one, breaking upgrades over older nightlies.
          fetch-depth: 20

      - name: Free up disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
                      /opt/hostedtoolcache/go /opt/hostedtoolcache/node
          sudo docker image prune --all --force > /dev/null
          # R8 peaks past the runner's 16 GB; without swap the kernel kills the runner agent itself.
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK and CMake
        run: |
          set -euo pipefail
          printf 'y\n%.0s' {1..50} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$NDK_VERSION" "$CMAKE_VERSION"

      - name: Assemble APKs
        run: |
          ./gradlew :vector-app:assembleRelease --stacktrace -x lintVitalRelease \
            -Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            -Dkotlin.daemon.jvmargs=-Xmx2g \
            --max-workers=2

      - name: Report memory and disk headroom
        if: always()
        run: |
          free -h
          df -h /

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find vector-app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts
          # The upload below needs room the build no longer does; / runs out otherwise.
          find . -type d -name build -prune -exec rm -rf {} +
          df -h /

      - name: Update the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Nightly build of Voyage at [$(git rev-parse --short HEAD)](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA})."
            echo
            echo "Recent commits:"
            git log -10 --pretty="- [%h](${{ github.server_url }}/${{ github.repository }}/commit/%H) %s"
          } > release-notes.md

          # The release keeps one tag forever; move it to the commit being built.
          git tag -f nightly "${{ github.sha }}"
          git push -f origin refs/tags/nightly

          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --title 'Nightly' --notes-file release-notes.md --prerelease --draft=false
            gh release view nightly --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset nightly "$asset" --yes
            done
          else
            gh release create nightly --title 'Nightly' --notes-file release-notes.md --prerelease
          fi

          gh release upload nightly artifacts/*.apk
