name: Release APKs

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Only libopus/libce compile native code; the 21.3.6528147 elsewhere is inert.
  NDK_VERSION: 'ndk;23.2.8568313'
  CMAKE_VERSION: 'cmake;3.22.1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout the commit to build
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      - name: Set the release date from the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]{8}$ ]]
          formatted="${RELEASE_TAG:0:4}-${RELEASE_TAG:4:2}-${RELEASE_TAG:6:2}"
          [ "$(date --utc --date="$formatted" +%Y%m%d)" = "$RELEASE_TAG" ]
          echo "VOYAGE_RELEASE_DATE=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Find the previous release
        run: |
          set -euo pipefail
          previous_tag=$(git tag --merged HEAD --list '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]' | \
            awk -v current="$VOYAGE_RELEASE_DATE" '$0 < current' | sort -r | sed -n '1p')
          previous_commit=
          if [ -n "$previous_tag" ]; then
            previous_commit=$(git rev-parse "refs/tags/$previous_tag^{commit}")
          fi
          echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
          echo "PREVIOUS_COMMIT=$previous_commit" >> "$GITHUB_ENV"

      - name: Free up disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android/sdk/ndk &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo docker image prune --all --force > /dev/null &
          wait
          # R8 peaks past the runner's 16 GB; without swap the kernel kills the runner agent itself.
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK and CMake
        run: |
          set -euo pipefail
          printf 'y\n%.0s' {1..50} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$NDK_VERSION" "$CMAKE_VERSION"

      - name: Assemble APKs
        run: |
          ./gradlew :vector-app:assembleRelease --stacktrace -x lintVitalRelease \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            -Dkotlin.daemon.jvmargs=-Xmx2g \
            --max-workers=2

      - name: Report memory and disk headroom
        if: always()
        run: |
          free -h
          df -h /

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find vector-app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts
          # The upload below needs room the build no longer does; / runs out otherwise.
          find . -type d -name build -prune -exec rm -rf {} +
          df -h /

      - name: Create the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="$VOYAGE_RELEASE_DATE"
          existing_draft=$(gh release view "$release_tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing_draft" = 'false' ]; then
            echo "Release $release_tag is already published; keeping it unchanged."
            exit 0
          fi

          release_sha=$(git rev-parse HEAD)
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha)" = "$release_sha" ]
          {
            echo "Release of Voyage at [$(git rev-parse --short HEAD)](${{ github.server_url }}/${{ github.repository }}/commit/$release_sha)."
            echo
            if [ -n "$PREVIOUS_COMMIT" ]; then
              echo "Changes since release $PREVIOUS_TAG:"
              git log "$PREVIOUS_COMMIT..HEAD" --invert-grep --grep='^Add F-Droid changelogs for ' \
                --pretty="- [%h](${{ github.server_url }}/${{ github.repository }}/commit/%H) %s"
            else
              echo "Initial release."
            fi
          } > release-notes.md

          if [ "$existing_draft" != 'true' ]; then
            gh release create "$release_tag" \
              --title "Voyage $release_tag" \
              --notes-file release-notes.md \
              --verify-tag --draft
          fi

          gh release upload "$release_tag" artifacts/*.apk --clobber
          gh release edit "$release_tag" --draft=false

          gh release view "$release_tag" --json isDraft,isPrerelease,tagName,assets --jq '{isDraft, isPrerelease, tagName, assets: [.assets[].name]}'
          [ "$(gh release view "$release_tag" --json isPrerelease --jq .isPrerelease)" = 'false' ]
          [ "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" = 'false' ]
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha)" = "$release_sha" ]
