// Desktop boot sample: a plain kotlin-jvm application that runs the SDK off-Android through
// :matrix-sdk-desktop, proving the persistence/crypto/store layers and a live login→sync→send.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'application'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

application {
    mainClass = 'im.vector.matrixcli.MainKt'
}

dependencies {
    implementation project(':matrix-sdk-desktop')
    implementation "app.cash.sqldelight:sqlite-driver:2.0.2"
    // Reflection-based Kotlin adapter (KotlinJsonAdapterFactory) for the sample's own models, since
    // the sample doesn't run Moshi's kapt codegen.
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'
}

// The smoke pokes internal SDK machinery (session manager, stores) through both SDK jars.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
    task.friendPaths.from(providers.provider {
        task.libraries.files.findAll { it.name.contains('matrix-sdk-core') || it.name.contains('matrix-sdk-desktop') }
    })
}
