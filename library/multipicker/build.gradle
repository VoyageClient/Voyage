apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    namespace "im.vector.lib.multipicker"

    compileSdk versions.compileSdk

    defaultConfig {
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility versions.sourceCompat
        targetCompatibility versions.targetCompat
    }

    kotlinOptions {
        jvmTarget = versions.jvmTarget
        // jxl-coder is built with Kotlin 2.x; see vector/build.gradle.
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}

dependencies {
    implementation project(":library:core-utils")

    api libs.androidx.activity
    implementation libs.androidx.exifinterface
    implementation libs.androidx.core
    // JPEG XL dimensions at pick time; BitmapFactory can't read it. minSdk 21, reached only through
    // JxlSizeReader behind a version check.
    implementation('io.github.awxkee:jxl-coder:2.5.2') {
        exclude group: 'androidx.appcompat'
        exclude group: 'androidx.core', module: 'core-ktx'
        exclude group: 'com.google.android.material'
        exclude group: 'org.jetbrains.kotlin'
    }

    // Log
    implementation libs.jakewharton.timber
}
