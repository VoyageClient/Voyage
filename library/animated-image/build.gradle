plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace "im.vector.lib.animatedimage"

    compileSdk versions.compileSdk
    defaultConfig {
        minSdk versions.minSdk
        targetSdk versions.targetSdk
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility versions.sourceCompat
        targetCompatibility versions.targetCompat
    }

    kotlinOptions {
        jvmTarget = versions.jvmTarget
        // jxl-coder is built with Kotlin 2.x; see vector/build.gradle.
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}

dependencies {
    implementation libs.jakewharton.timber

    // GIF and animated-WebP frame decoding. Both are api: the readers are the module's whole point,
    // and callers need the transitive classes to hold onto what they hand back.
    api 'com.github.bumptech.glide:gifdecoder:4.16.0'
    api 'com.github.zjupure:webpdecoder:2.7.4.16.0'
    // Animated JPEG XL frames. minSdk 21 and it loads its .so from a static initialiser, so it is
    // reached only through JxlFrameReader behind a version check.
    api('io.github.awxkee:jxl-coder:2.5.2') {
        exclude group: 'androidx.appcompat'
        exclude group: 'androidx.core', module: 'core-ktx'
        exclude group: 'com.google.android.material'
        exclude group: 'org.jetbrains.kotlin'
    }

    // TESTS
    testImplementation libs.tests.junit
    testImplementation libs.tests.kluent
}
