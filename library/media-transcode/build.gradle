plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace "im.vector.lib.mediatranscode"

    compileSdk versions.compileSdk
    defaultConfig {
        minSdk versions.minSdk
        targetSdk versions.targetSdk
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // For BuildConfig.DEBUG: this module cannot see the SDK's DebugLog, so its own diagnostics gate on this.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility versions.sourceCompat
        targetCompatibility versions.targetCompat
    }

    kotlinOptions {
        jvmTarget = versions.jvmTarget
    }
}

dependencies {
    implementation libs.jetbrains.coroutinesAndroid
    implementation libs.jakewharton.timber

    // Annotations only — compileOnly keeps AndroidX out of this module's runtime graph.
    compileOnly "androidx.annotation:annotation:1.7.1"

    // TESTS
    testImplementation libs.tests.junit
    testImplementation libs.tests.kluent
}
