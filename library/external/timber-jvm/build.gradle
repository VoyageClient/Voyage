// JVM stand-in for the Android-only Timber library (an AAR), providing the timber.log.Timber call
// surface the matrix-sdk core uses so the same sources compile and run on desktop JVM. Nothing in
// the Android app depends on it — the app keeps the real Timber.
apply plugin: 'org.jetbrains.kotlin.jvm'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

apply from: "$rootDir/gradle/jvm-publish.gradle"
